name: Tests (RSpec)
on: [push]
jobs:
  test:
    name: 'Tests (os: ${{ matrix.os }}) (ruby@${{ matrix.ruby_version }})'
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ['4.0']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_RETRY: 3
      BUNDLE_JOBS: 4
      BUNDLE_FORCE_RUBY_PLATFORM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: supercharge/redis-github-action@1.8.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      # NOTE: (parallel specs) the example durations of the previous runs balance the workers
      #   (a new cache entry per run, restored from the latest one of the branch or of the default branch)
      - uses: actions/cache@v4
        with:
          path: tmp/rspec_parallel/durations.json
          key: rspec-durations-${{ github.run_id }}
          restore-keys: rspec-durations-
      - name: Tests (RSpec)
        run: bundle exec rake rspec:parallel
      - name: Worker logs (RSpec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-worker-logs
          path: tmp/rspec_parallel/worker-*.log
