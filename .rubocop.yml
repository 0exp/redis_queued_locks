inherit_gem:
  armitage-rubocop:
    - lib/rubocop.general.yml
    - lib/rubocop.rake.yml
    - lib/rubocop.rspec.yml

# NOTE: Ruby sources only. RBS signatures (sig/**/*.rbs) are linted separately with
#   .rubocop.rbs.yml: the Ruby cops (and the project index they use) must not see them;
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Include:
    - lib/**/*.rb
    - spec/**/*.rb
    - Gemfile
    - Rakefile
    - redis_queued_locks.gemspec
    - bin/console

Metrics/ParameterLists:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Lint/EmptyBlock:
  Exclude:
    - spec/**/*.rb

Gemspec/DevelopmentDependencies:
  EnforcedStyle: Gemfile

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineEndStringConcatenationIndentation:
  Enabled: false
